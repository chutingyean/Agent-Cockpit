<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Cockpit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Agent Cockpit"%3E %3Cdefs%3E %3ClinearGradient id="bg" x1="0" y1="0" x2="1" y2="1"%3E%3Cstop offset="0" stop-color="%233b7bff"/%3E%3Cstop offset="1" stop-color="%231f4fc4"/%3E%3C/linearGradient%3E %3C/defs%3E %3Crect width="128" height="128" rx="28" fill="url%28%23bg%29"/%3E %3Ccircle cx="64" cy="64" r="38" fill="none" stroke="%23ffffff" stroke-opacity=".28" stroke-width="10"/%3E %3Cpath d="M64 26 A38 38 0 1 1 27.9 76.2" fill="none" stroke="%235ee0a0" stroke-width="10" stroke-linecap="round"/%3E %3Cpath d="M30.6 46 A38 38 0 0 1 52 27.9" fill="none" stroke="%23ff7a7a" stroke-width="10" stroke-linecap="round"/%3E %3Ccircle cx="64" cy="64" r="15" fill="%23ffffff"/%3E %3Ccircle cx="64" cy="64" r="6" fill="%231f4fc4"/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f6; --grid:#dfe3e8; --surface:#fff; --surface-2:#eef0f4; --border:#dfe3e8; --text:#1b1f24; --muted:#5f6b7a; --faint:#a3acb9;
  --accent:#2f6fed; --accent-soft:#e9f0fe; --ok:#1a8a4a; --ok-soft:#e5f5ec; --warn:#a8650f; --warn-soft:#fdf3e1; --danger:#d13434; --danger-soft:#fdeaea;
  --k-stage:#b7791f; --k-task:#7c4dcc; --k-claim:#2f6fed; --k-run:#5f6b7a; --k-code:#0f8a8a; --k-html:#1a8a4a; --k-ua:#c2418c; --k-note:#8a6d0f;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115; --grid:#1d222a; --surface:#181b22; --surface-2:#20242d; --border:#2c313c; --text:#e6e8ec; --muted:#9aa3b2; --faint:#566070;
  --accent:#6c9dff; --accent-soft:#1b2640; --ok:#4cc38a; --ok-soft:#14281e; --warn:#e0a84a; --warn-soft:#2a2113; --danger:#f07070; --danger-soft:#2d1717;
  --k-stage:#e0a84a; --k-task:#b48cff; --k-claim:#6c9dff; --k-run:#9aa3b2; --k-code:#3cc6c6; --k-html:#4cc38a; --k-ua:#f07ac0; --k-note:#e6c34a;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  display:grid;grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);overflow:hidden}
button,select{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
code{font:12.5px var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);z-index:5;min-width:0}
.brand{font-weight:650;white-space:nowrap;display:flex;gap:7px;align-items:center}
.brand i{color:var(--accent);font-style:normal;font-size:18px}
.status{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;font-size:13px}
.status .k{color:var(--muted);font-size:12px}
.status .good{color:var(--ok);font-weight:650} .status .bad{color:var(--danger);font-weight:650}
.status .next{color:var(--warn);font-weight:600}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.btn[aria-pressed=true]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:650}
.btn .cnt{background:var(--danger);color:var(--surface);border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px;font-weight:700}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.live b{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on b{background:var(--ok)}
.replaybar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--warn-soft);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--warn)}
.replaybar{flex-wrap:wrap}.replaybar input{flex:1;min-width:160px}.replaybar select{font:inherit;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);padding:2px 4px}
.rtext{flex-basis:100%;color:var(--text);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rtext em{color:var(--muted);font-style:normal;margin-left:6px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;grid-row:3}
.main.nodock{grid-template-columns:minmax(0,1fr) 0}
.main.nodock .panel{display:none}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr) 0}.main .panel{display:none}.main.dockopen .panel{display:flex;position:absolute;right:0;top:0;bottom:0;width:min(340px,100%);z-index:6}.status{display:none}}

.viewport{position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.3px,transparent 1.3px)}
.viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.e{fill:none;stroke:var(--faint);stroke-width:2}
.e.k-flow{stroke:var(--k-stage);stroke-width:3}
.e.k-link{stroke:var(--k-task);stroke-dasharray:2 6;stroke-width:2.2}
.e.k-reference{stroke:var(--k-claim);stroke-dasharray:9 6;opacity:.75}
.e.k-uses{stroke:var(--k-code);opacity:.7}
.e.broken{stroke:var(--danger)!important;stroke-width:4!important;opacity:1!important;stroke-dasharray:none}
.e.chain{stroke:var(--accent);stroke-width:4;opacity:1}
.e.dim{opacity:.08!important}
.elabel{font:13px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.elabel.broken{fill:var(--danger)} .elabel.dim{opacity:.1}
.ah{fill:var(--faint)} .ah-bad{fill:var(--danger)}

.region{position:absolute;border:2px dashed var(--faint);border-radius:16px;background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.region>.rh{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:17px;font-weight:650;color:var(--muted)}
.region>.rh small{font-size:12px;font-weight:600;color:var(--k-html)}
.region.layer{border:1.5px solid color-mix(in srgb,var(--k-code) 50%,var(--border));background:color-mix(in srgb,var(--k-code) 5%,transparent);border-radius:12px}
.region.layer>.rh{height:62px;flex-wrap:wrap;align-content:center;gap:0 10px;color:var(--text);font-size:16px}
.region.layer .rs{font-size:13px;font-weight:600;color:var(--ok)}
.region.layer .rs.bad{color:var(--danger)}
.region.layer .ua{flex-basis:100%;font-size:12.5px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region.layer .ua b{color:var(--k-ua);font-weight:650;font-size:11px;margin-right:4px}
.region.dim{opacity:.25}
.region.tourOn{box-shadow:0 0 0 6px var(--k-ua)}

.n{position:absolute;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--kc);border-radius:10px;padding:9px 12px;
  box-shadow:0 1px 3px rgba(16,24,40,.08);overflow:hidden;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:opacity .2s,box-shadow .2s}
.n>*{flex-shrink:0}
.n>.s,.n>.lesson{flex-shrink:1;min-height:0}
.n:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--kc) 60%,transparent)}
.n.sel{box-shadow:0 0 0 4px var(--accent)}
.n.tourOn{box-shadow:0 0 0 6px var(--k-ua)}
.n.bad{border-color:var(--danger);border-top-color:var(--danger);background:color-mix(in srgb,var(--danger-soft) 70%,var(--surface))}
.n.dim{opacity:.15}
.n.match{box-shadow:0 0 0 4px var(--warn)}
.n.fresh{animation:fresh 2.4s}
@keyframes fresh{0%,50%{box-shadow:0 0 0 6px var(--ok)}100%{box-shadow:0 1px 3px rgba(16,24,40,.08)}}
.n .kind{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;color:var(--kc)}
.n .kind .r{margin-left:auto;font-weight:500;color:var(--muted);font:11px var(--mono)}
.n .t{font-weight:650;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n .t.mono{font:600 13.5px var(--mono)}
.n .s{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n .lesson{font-size:12px;color:var(--k-ua);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:auto}
.chip{font-size:11.5px;border-radius:5px;padding:0 6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);font-weight:650}
.chip.bad{background:var(--danger);color:var(--surface);font-weight:700}
.chip.warn{background:var(--warn-soft);color:var(--warn);font-weight:650}
.chip.acc{background:var(--accent-soft);color:var(--accent);font-weight:650}
.chip.mono{font-family:var(--mono)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--k-task)}
.n.k-agentTask{border-top:1px solid var(--border);border-left:6px solid var(--sc)}
.n.k-agentTask.blocked{--sc:var(--warn)} .n.k-agentTask.doing{--sc:var(--k-task)} .n.k-agentTask.done{--sc:var(--ok)}
.n.k-html .slot{height:470px;border:1px solid var(--border);border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--danger);display:inline-block;box-shadow:0 0 0 2px var(--surface)}
#briefFrame{position:absolute;border:0;border-radius:6px;transform-origin:0 0;pointer-events:none;background:transparent}
#world.far .n .s,#world.far .n .row,#world.far .n .lesson,#world.far .elabel,#world.far .region .ua{display:none}
#world.far .n .t{font-size:34px;-webkit-line-clamp:2}
#world.far .n .kind{font-size:22px}
#world.far .region>.rh{font-size:40px;height:70px}
#world.far .region.layer .rs{font-size:30px}

.toolbar{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:2;pointer-events:none}
.toolbar>*{pointer-events:auto}
.seg{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button{border:none;background:none;padding:5px 10px;font-size:12.5px;white-space:nowrap}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.seg.ua{border-color:color-mix(in srgb,var(--k-ua) 50%,var(--border))}
.seg.ua .lab{font-size:11px;font-weight:700;color:var(--k-ua);padding:0 4px 0 10px;white-space:nowrap}
.seg.ua button[aria-pressed=true]{background:color-mix(in srgb,var(--k-ua) 14%,var(--surface));color:var(--k-ua)}
.tourpick{border:1px solid color-mix(in srgb,var(--k-ua) 50%,var(--border));background:var(--surface);color:var(--k-ua);font-weight:650;border-radius:9px;padding:5px 8px;font-size:12.5px;max-width:230px}
.search{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:5px 10px;width:140px;color:var(--text);font:inherit;font-size:12.5px}
.zoom{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;align-items:center;gap:8px}
.zoom .seg span{font:12px var(--mono);color:var(--muted);min-width:44px;text-align:center}
.hud{font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
.toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;z-index:4;max-width:calc(100% - 24px)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;pointer-events:none}
.empty b{display:block;font-size:17px;color:var(--text);margin-bottom:6px}

.tourbubble{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:min(540px,calc(100% - 24px));background:var(--surface);border:2px solid var(--k-ua);border-radius:12px;padding:10px 14px;z-index:3;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.tourbubble .src{font-size:11px;font-weight:700;color:var(--k-ua)}
.tourbubble h4{margin:2px 0 4px;font-size:15px}
.tourbubble p{margin:0;font-size:13px}
.tourbubble .lesson{margin-top:6px;font-size:12.5px;background:color-mix(in srgb,var(--k-ua) 10%,var(--surface));border-radius:6px;padding:5px 8px}
.tourbubble .dots{display:flex;gap:4px;margin-top:8px}
.tourbubble .dots i{width:18px;height:4px;border-radius:2px;background:var(--surface-2)}
.tourbubble .dots i.on{background:var(--k-ua)}
.viewer{position:absolute;inset:10px;z-index:5;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.viewer .vh{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap}
.viewer .vh small{color:var(--muted)}
.viewer .vh .x{margin-left:auto;border:none;background:none;font-size:18px;color:var(--muted);padding:2px 8px;border-radius:6px}
.viewer iframe{flex:1;border:0;border-radius:0 0 12px 12px;background:var(--bg);width:100%}

.panel{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);font-weight:650}
.ph .x{margin-left:auto;border:none;background:none;color:var(--muted);font-size:17px;padding:2px 8px;border-radius:6px}
.ph .back{border:none;background:none;color:var(--accent);font-size:13px;padding:0}
.pb{overflow:auto;padding:10px 14px 24px}
.sec{margin-bottom:14px}
.sec h3{font-size:12px;color:var(--muted);margin:6px 0 6px;display:flex;gap:6px;align-items:center;font-weight:650}
.cnt{background:var(--surface-2);border-radius:99px;padding:0 7px;font-size:11.5px}
.cnt.hot{background:var(--danger-soft);color:var(--danger)}
.dec{border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:8px}
.dec.auto{border-color:var(--danger);background:var(--danger-soft)}
.dec .m{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dec .q{font-weight:650;font-size:13.5px;margin:3px 0}
.dec .rec{font-size:12.5px}
.dec .warnline{font-size:12px;color:var(--danger);font-weight:600;margin-top:3px}
.opts{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.opt{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:3px 10px;font-size:12.5px}
.opt:hover:not(:disabled){background:var(--surface-2)}
.opt.rec{border-color:var(--accent);color:var(--accent);font-weight:650}
.opt.brief{border-color:var(--k-html);color:var(--k-html);font-weight:650}
.opt.ua{border-color:var(--k-ua);color:var(--k-ua);font-weight:650}
.link{background:none;border:none;padding:0;color:var(--accent);font-size:12.5px;text-align:left}
.link:hover{text-decoration:underline}
.done{font-size:12.5px;color:var(--ok);margin-top:4px}
.li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--border);font-size:12.5px;flex-wrap:wrap}
.li:first-of-type{border-top:none}
.li code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li .sub{flex-basis:100%;color:var(--muted);font-size:12px}
.li .sub.bad{color:var(--danger)}
.risk{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px}
.risk.高{background:var(--danger-soft);color:var(--danger)} .risk.中{background:var(--warn-soft);color:var(--warn)} .risk.低{background:var(--surface-2);color:var(--muted)}
.agent{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px;flex-wrap:wrap}
.agent b{font:600 12px var(--mono)}
.agent .ad{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.agent .ad.idle{background:var(--faint)}
.agent .rate{margin-left:auto;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:2px}
.tl div{font-size:12px;padding:3px 0 3px 8px;border-left:3px solid var(--border)}
.tl div.new{border-color:var(--accent)}
.tl div.bad{border-color:var(--danger);color:var(--danger)}
.tl time{font:11px var(--mono);color:var(--muted);margin-right:4px}
.tl em{font-style:normal;font:11px var(--mono);color:var(--faint);margin-left:4px}
.detail h2{font-size:17px;margin:2px 0 6px;line-height:1.4}
.detail .kindline{font-size:12px;font-weight:700;color:var(--kc)}
.detail p{margin:4px 0;font-size:13px}
.verdict{font-size:12.5px;border-radius:8px;padding:7px 10px;margin:8px 0}
.verdict.bad{background:var(--danger-soft);color:var(--danger)} .verdict.ok{background:var(--ok-soft);color:var(--ok)}
.hop{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:4px 0}
.hop .lay{font-size:11.5px;font-weight:700;color:var(--muted);text-align:right;padding-top:5px}
.hop button{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:12.5px;width:100%}
.hop button:hover{background:var(--surface-2)}
.hop.bad button{border-color:var(--danger);color:var(--danger)}
.hop small{display:block;color:var(--muted);font-size:11.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.ua-box{background:color-mix(in srgb,var(--k-ua) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--k-ua) 30%,var(--border));border-radius:8px;padding:7px 9px;font-size:12.5px;margin:8px 0}
.ua-box .k{display:block;font-size:11px;font-weight:700;color:var(--k-ua);margin-bottom:2px}
.finding{font-size:12.5px;background:var(--danger-soft);color:var(--danger);border-radius:7px;padding:6px 9px;margin:6px 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>◎</i>Agent Cockpit</div>
  <div class="status" id="status"></div>
  <button class="btn" id="replay" aria-pressed="false">⏪ 重播</button>
  <div class="live" id="live" title="agent 一寫入就更新"><b></b>即時</div>
  <button class="btn" id="dockBtn">駕駛艙<span class="cnt" id="dockCnt"></span></button>
</header>
<div class="replaybar" id="replaybar" hidden>
  <button class="btn" id="play" aria-label="播放">▶ 播放</button>
  <select id="speed" aria-label="播放速度"><option value="1600">慢</option><option value="800" selected>正常</option><option value="300">快</option></select>
  <input type="range" id="until" min="1" step="1" aria-label="重播到第幾個事件"><b id="untilLabel"></b>
  <button class="btn" id="now">回到現在</button>
  <div class="rtext" id="untilText"></div>
</div>
<div class="main" id="main">
  <div class="viewport" id="vp">
    <div id="world"><svg id="edges"></svg><div id="regions"></div><div id="nodes"></div><iframe id="briefFrame" sandbox="allow-scripts" tabindex="-1" aria-hidden="true" title="證據簡報預覽" hidden></iframe></div>
    <div class="empty" id="empty" hidden><div><b>白板還是空的</b>在研究專案裡執行 <code>cockpit init</code>，再讓 agent 透過 MCP 開始寫入；<br>或執行 <code>npm run demo</code> 產生示範研究專案。</div></div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="視角" id="lenses"></div>
      <div class="seg ua" role="group" aria-label="讀者模式（Understand-Anything）">
        <span class="lab">UA 讀者</span>
        <button data-persona="non-technical" aria-pressed="false">總覽</button>
        <button data-persona="junior" aria-pressed="true">學習</button>
        <button data-persona="experienced" aria-pressed="false">深入</button>
      </div>
      <select class="tourpick" id="tourPick" aria-label="導覽（Understand-Anything）"></select>
      <input class="search" id="search" type="search" placeholder="搜尋卡片" aria-label="搜尋卡片">
    </div>
    <div class="zoom">
      <div class="seg"><button id="zout" aria-label="縮小">−</button><span id="zread">100%</span><button id="zin" aria-label="放大">＋</button></div>
      <span class="hud" id="hud"></span>
    </div>
    <div class="tourbubble" id="tour" hidden role="dialog" aria-label="導覽"></div>
    <div class="viewer" id="viewer" hidden role="dialog" aria-label="證據簡報">
      <div class="vh"><b>證據簡報</b><small>answer-me-with-html 的 am CLI 排版 · 內容由證據鏈自動組成 · 0 LLM token</small><button class="x" data-closeviewer aria-label="關閉">✕</button></div>
      <iframe id="viewerFrame" sandbox="allow-scripts" allow="clipboard-write" title="證據簡報"></iframe>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

<script>
const S = { until:null, sel:null, tour:null, dock:true, persona:'junior', lens:'all' };
const PERSONA = { 'non-technical':'總覽', junior:'學習', experienced:'深入' };
const KC = { stage:'--k-stage', agentTask:'--k-task', analysis:'--k-claim', run:'--k-run', code:'--k-code', html:'--k-html' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const short = p => String(p).split('/').pop();
const hhmm = ts => ts ? new Date(ts).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false }) : '';
const store = { get:k => { try { return localStorage.getItem(k); } catch { return null; } }, set:(k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let V = null, D = null, byId = new Map(), broken = new Set(), prevIds = new Set();

async function load(){
  const r = await fetch('/api/state' + (S.until ? `?until=${S.until}` : ''));
  if (!r.ok) return toast('讀取白板失敗');
  V = await r.json(); D = V.D;
  byId = new Map(V.board.nodes.map(n => [n.id, n])); broken = new Set(D.broken);
  if (S.sel && !byId.has(S.sel)) S.sel = null;
  render();
  const fresh = prevIds.size ? V.board.nodes.filter(n => !prevIds.has(n.id)) : [];
  fresh.forEach(n => document.querySelector(`.n[data-id="${CSS.escape(n.id)}"]`)?.classList.add('fresh'));
  prevIds = new Set(V.board.nodes.map(n => n.id));
  // 重播時白板的大小變了（例如簡報框出現）就把整張白板放進畫面，不然播到斷鏈那一刻會看不到簡報
  const bk = JSON.stringify(V.board.bounds);
  if (S.until && load.bk && bk !== load.bk) fitAll();
  load.bk = bk;
}
const find = { claim:id => D.claims.find(c => c.id === id), run:id => D.runs.find(r => r.id === id), file:id => D.files.find(f => `file:${f.path}` === id) };

function cardHTML(n){
  const P = S.persona;
  let head = '', body = '', bad = false, extra = '';
  if (n.kind === 'stage') {
    const s = D.stages.find(x => x.id === n.id), label = { done:['完成', 'ok'], active:['進行中', 'acc'], todo:['未開始', ''] }[s.status] || ['', ''];
    head = `◆ 階段<span class="r">${esc(s.id)}</span>`;
    body = `<div class="t">${esc(s.title)}</div><div class="s">產出：${esc(s.out)}</div>
      <div class="row"><span class="chip ${label[1]}">${label[0]}</span>${s.needs.map(([t, okk]) => `<span class="chip ${okk ? 'ok' : 'warn'} mono">${okk ? '✓' : '✗'} ${esc(t)}</span>`).join('')}${s.human ? '<span class="chip warn">要人看過</span>' : ''}</div>`;
  } else if (n.kind === 'agentTask') {
    const t = D.tasks.find(x => x.id === n.id); extra = ' ' + t.state;
    head = `✓ 任務 · ${esc(t.agent)}<span class="r">${esc(t.id)}</span>`;
    body = `<div class="t">${esc(t.title)}</div><div class="s">${esc([t.where, t.step].filter(Boolean).join(' · ') || t.summary)}</div>
      <div class="row">${t.progress != null ? `<span class="bar"><i style="width:${t.progress}%"></i></span>` : ''}<span class="chip ${t.state === 'blocked' ? 'warn' : t.state === 'done' ? 'ok' : 'acc'}">${{ doing:'進行中', blocked:'卡住', done:'完成' }[t.state]}</span></div>`;
  } else if (n.kind === 'analysis') {
    const c = find.claim(n.id); bad = c.health === 'recheck';
    const val = c.evidence.filter(e => e.value !== undefined).map(e => `${e.key} = ${typeof e.value === 'object' ? JSON.stringify(e.value) : e.value}`).join('、');
    head = `◇ 結論 · 假設 ${esc(c.hypothesis)}<span class="r">${esc(c.id)}</span>`;
    body = `<div class="t">${esc(c.text)}</div><div class="s">${P === 'experienced' ? esc(val || c.evidence.map(e => e.run).join('、')) : bad ? esc(c.reasons[0]) : `證據：${esc(c.runs.join('、'))}${val ? `（${esc(val)}）` : ''}`}</div>
      <div class="row">${bad ? `<span class="chip bad">⛓ ${P === 'non-technical' ? '這個結論暫時不能信' : '待重驗'}</span>` : c.health === 'valid' ? '<span class="chip ok">✓ 有效</span>' : '<span class="chip warn">沒有證據</span>'}${c.doubt.length ? '<span class="chip warn">⚑ 有疑慮</span>' : ''}</div>`;
  } else if (n.kind === 'run') {
    const r = find.run(n.id); bad = r.stale && r.cited;
    head = `▶ 執行 · ${esc(r.agent)}<span class="r">${esc(r.id)}</span>`;
    body = `<div class="t mono">${esc(r.cmd)}</div><div class="s">${P === 'non-technical' ? `${esc(hhmm(r.ts))} 跑的，寫出 ${Object.keys(r.outputs).length} 個檔案` : `commit ${esc(r.commit || '未 commit')} · ${esc(hhmm(r.ts))} · 寫出 ${esc(Object.keys(r.outputs).map(short).join('、') || '沒有')}`}</div>
      <div class="row">${r.exit !== 0 ? '<span class="chip warn">執行失敗</span>' : ''}${bad ? `<span class="chip bad">${P === 'non-technical' ? '數字已過期' : `過期：${esc(r.hits.map(short).join('、'))} 被改`}</span>` : r.stale ? '<span class="chip">過期 · 沒有結論引用</span>' : '<span class="chip ok">✓ 執行後沒變</span>'}</div>`;
  } else if (n.kind === 'code') {
    const f = find.file(n.id); bad = !!f.change && D.runs.some(r => r.cited && r.hits.includes(f.path));
    head = `‹› 檔案${f.unreported ? ' <span class="dot" title="未回報"></span>' : ''}<span class="r">${esc(V.D.depSource === 'graphify' ? 'graphify' : '程式碼圖')}${f.fromUA ? ' · UA' : ''}</span>`;
    const chips = P === 'non-technical'
      ? `${f.change ? '<span class="chip bad">剛被改過</span>' : ''}${f.finding ? '<span class="chip warn">審查發現問題</span>' : ''}`
      : `${f.change ? `<span class="chip ${bad ? 'bad' : 'warn'}">${esc((f.change.funcs || []).join('、') || '有變更')}${f.unreported ? ' 未回報' : ''}</span>` : ''}${f.finding ? `<span class="chip warn">⚑ ${esc(f.finding.severity)}</span>` : ''}${f.core ? '<span class="chip acc">核心</span>' : ''}${P === 'experienced' && f.complexity ? `<span class="chip">${esc(f.complexity)}</span>` : ''}`;
    body = `<div class="t ${P === 'non-technical' ? '' : 'mono'}">${esc(P === 'non-technical' ? short(f.path) : f.path)}</div><div class="s">${esc(f.summary || '（沒有說明）')}</div>
      ${P === 'junior' && f.lesson ? `<div class="lesson">小知識：${esc(f.lesson)}</div>` : ''}<div class="row">${chips}</div>`;
  } else if (n.kind === 'html') {
    const d = D.decisions.find(x => x.id === n.decision);
    head = `⧉ 證據簡報<span class="r">answer-me-with-html</span>`;
    body = `<div class="t">${esc(d ? d.question : '證據簡報')}（點一下放大）</div><div class="slot">產生中…</div><div class="s">引擎把證據鏈組成 Markdown 草稿，am CLI 排成一頁 HTML；不需要 LLM 寫內容。</div>`;
  } else {
    const x = D.notes.find(y => y.id === n.id) || {};
    head = `▤ ${esc(n.kind)}<span class="r">${esc(n.id)}</span>`;
    body = `<div class="t">${esc(x.title)}</div><div class="s">${esc(x.body || x.ref || '')}</div>`;
  }
  return `<div class="n k-${esc(n.kind)}${extra} ${bad ? 'bad' : ''}" data-id="${esc(n.id)}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;--kc:var(${KC[n.kind] || '--k-note'})">
    <div class="kind">${head}</div>${body}</div>`;
}

function clip(n, tx, ty){
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2, dx = tx - cx, dy = ty - cy;
  const s = Math.min(Math.abs(n.w / 2 / (dx || 1e-9)), Math.abs(n.h / 2 / (dy || 1e-9)), 1);
  return [cx + dx * s, cy + dy * s];
}

function render(){
  if (!V) return;
  const focus = focusSet(), tourIds = S.tour ? S.tour.steps[S.tour.i].nodeIds : [];
  $('#empty').hidden = V.board.nodes.length > 0;
  $('#lenses').innerHTML = `<button data-lens="all" aria-pressed="${S.lens === 'all'}">全部</button>` + V.board.frames.map(f => `<button data-lens="${f.id}" aria-pressed="${S.lens === f.id}">${esc(f.title)}</button>`).join('');
  $('#regions').innerHTML = V.board.frames.map(f => `<div class="region" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px"><div class="rh">${esc(f.title)}${f.id === 'D' ? `<small>${esc(D.depSource)}${D.layers[0]?.source === 'Understand-Anything' ? ' × UA' : ''}</small>` : f.id === 'E' ? '<small>answer-me-with-html 產生</small>' : ''}</div></div>`).join('')
    + V.board.regions.map(L => `<div class="region layer ${focus && !focus.nodes.has(L.id) ? 'dim' : ''} ${tourIds.includes(L.id) ? 'tourOn' : ''}" style="left:${L.x}px;top:${L.y}px;width:${L.w}px;height:${L.h}px">
      <div class="rh">‹› 層：${esc(L.name)}<span class="rs ${L.bad.length ? 'bad' : ''}">支撐 ${L.claims.length} 個結論${L.bad.length ? ` · ⛓ ${L.bad.length} 待重驗` : L.claims.length ? ' · 全部有效' : ''}</span><span class="ua">${L.source === 'Understand-Anything' ? '<b>UA</b>' : ''}${esc(L.description)}（${esc(L.source)}）</span></div></div>`).join('');
  $('#nodes').innerHTML = V.board.nodes.map(cardHTML).join('');
  document.querySelectorAll('.n').forEach(el => {
    const id = el.dataset.id;
    if (focus && !focus.nodes.has(id)) el.classList.add('dim');
    if (S.sel === id) el.classList.add('sel');
    if (tourIds.includes(id)) el.classList.add('tourOn');
  });
  $('#edges').innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-bad"/></marker></defs>`
    + V.board.edges.map(e => {
      const a = byId.get(e.from), b = byId.get(e.to), k = `${e.from}>${e.to}`, isBad = broken.has(k), inF = focus && focus.edges.has(k);
      const [x1, y1] = clip(a, b.x + b.w / 2, b.y + b.h / 2), [x2, y2] = clip(b, a.x + a.w / 2, a.y + a.h / 2);
      return `<path class="e k-${esc(e.kind)}${isBad ? ' broken' : ''}${focus ? (inF ? (isBad ? '' : ' chain') : ' dim') : ''}" d="M${x1},${y1}L${x2},${y2}" marker-end="url(#${isBad ? 'ahb' : 'ah'})"/>`
        + (e.label ? `<text class="elabel${isBad ? ' broken' : ''}${focus && !inF ? ' dim' : ''}" x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 8}" text-anchor="middle">${esc(e.label)}</text>` : '');
    }).join('');
  placeBrief();
  renderHeader(); renderPanel(); renderTour(); applySearch();
}

// 簡報：抓回 HTML 後用 srcdoc 放進沙盒 iframe（縮圖與放大共用同一份，只在證據鏈變了才重抓）
const briefs = new Map();
async function briefHtml(id, until = S.until){
  const key = `${id}|${until || 'now'}|${until ? '' : D.bad.join(',')}`;
  if (!briefs.has(key)) briefs.set(key, fetch(`/api/brief/${encodeURIComponent(id)}${until ? `?until=${until}` : ''}`).then(r => r.text()));
  return briefs.get(key);
}
function placeBrief(){
  const f = $('#briefFrame'), n = V.board.nodes.find(x => x.kind === 'html');
  f.hidden = !n;
  if (!n) return;
  const key = `${n.decision}|${S.until || 'now'}|${D.bad.join(',')}`;
  if (f.dataset.key !== key) { f.dataset.key = key; briefHtml(n.decision).then(html => { if (f.dataset.key === key) f.srcdoc = html; }); }
  const w = n.w - 26, k = w / 1280;
  Object.assign(f.style, { left:(n.x + 13) + 'px', top:(n.y + 62) + 'px', width:'1280px', height:Math.round(468 / k) + 'px', transform:`scale(${k})` });
}

function focusSet(){
  const n = S.sel && byId.get(S.sel);
  if (!n) return null;
  const set = { nodes:new Set([n.id]), edges:new Set() };
  if (n.kind === 'analysis') {
    const c = find.claim(n.id);
    for (const rid of c.runs) {
      const r = find.run(rid);
      set.nodes.add(rid); set.edges.add(`${c.id}>${rid}`);
      if (r.script) { set.nodes.add(`file:${r.script}`); set.edges.add(`${rid}>file:${r.script}`); }
      r.files.slice(1).forEach(f => { set.nodes.add(`file:${f}`); set.edges.add(`file:${r.script}>file:${f}`); });
      D.layers.filter(L => L.paths.includes(r.script)).forEach(L => set.nodes.add(L.id));
    }
  } else {
    V.board.edges.filter(e => e.from === n.id || e.to === n.id).forEach(e => { set.edges.add(`${e.from}>${e.to}`); set.nodes.add(e.from); set.nodes.add(e.to); });
    D.layers.forEach(L => set.nodes.add(L.id));
  }
  return set;
}

function renderHeader(){
  const v = D.claims.filter(c => c.health === 'valid').length, active = D.stages.find(s => s.status === 'active') || D.stages.find(s => s.status !== 'done');
  const pend = D.decisions.filter(d => d.answer == null);
  $('#status').innerHTML = `<b>${esc(V.project)}</b>${active ? `<span class="k">階段</span><span>${esc(active.title)}</span>` : ''}
    <span class="k">結論</span><span class="${D.bad.length ? 'bad' : 'good'}">${v}/${D.claims.length} 有效</span>
    <span class="k">要你決定</span><span class="next">${pend.map(d => esc(d.id.startsWith('AUTO:') ? short(d.path) : d.id)).join('／') || '無'}</span>${V.until ? `<span class="next">（重播中：事件 ${V.until}）</span>` : ''}`;
  const need = pend.length + D.unreported.length;
  $('#dockCnt').textContent = need; $('#dockCnt').hidden = !need;
  const pick = $('#tourPick');
  pick.innerHTML = `<option value="">▶ 導覽（UA）…</option>${V.tours.ua ? '<option value="ua">架構導覽 · UA 知識圖的 tour</option>' : ''}`
    + D.claims.map(c => `<option value="chain:${esc(c.id)}">${c.health === 'recheck' ? `為什麼 ${esc(c.id)} 要重驗` : `為什麼相信 ${esc(c.id)}`} · 證據鏈</option>`).join('');
  const u = $('#until'); u.max = V.lastId; u.value = S.until || V.lastId; $('#untilLabel').textContent = S.until ? `#${S.until} / ${V.lastId}` : `#${V.lastId}（現在）`;
  const cur = V.timeline[0];
  $('#untilText').innerHTML = S.until && cur ? `${esc(hhmm(cur.ts))}　${esc(cur.text)}<em>${esc(cur.agent)}</em>` : '拖動滑桿，或按「播放」從頭看研究怎麼走到現在';
}

/* ---------- 導覽：UA 的 tour 與證據鏈產生的 tour 用同一個播放器 ---------- */
function startTour(t){ if (!t) return; S.tour = { ...t, i:0 }; S.sel = null; render(); flyTo(boundsOf(S.tour.steps[0].nodeIds[0]), 1); }
function renderTour(){
  const b = $('#tour');
  if (!S.tour) { b.hidden = true; return; }
  const t = S.tour, s = t.steps[t.i], last = t.i === t.steps.length - 1;
  b.hidden = false;
  b.innerHTML = `<div class="src">Understand-Anything 導覽 · ${esc(t.source)}</div><h4>${t.i + 1}/${t.steps.length}　${esc(s.title)}</h4><p>${esc(s.description)}</p>
    ${s.languageLesson && S.persona !== 'non-technical' ? `<div class="lesson">小知識：${esc(s.languageLesson)}</div>` : ''}
    <div class="dots">${t.steps.map((_, i) => `<i class="${i <= t.i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="opts"><button class="opt" data-tour="-1" ${t.i ? '' : 'disabled'}>上一步</button><button class="opt ua" data-tour="1">${last ? '完成' : '下一步'}</button><button class="link" data-tour="end" style="margin-left:auto">結束導覽</button></div>`;
}

/* ---------- 右側：駕駛艙 ---------- */
function decHTML(d){
  const stale = d.chain ? [] : (d.grounds || []).filter(id => find.claim(id)?.health === 'recheck');
  const name = d.id.startsWith('AUTO:') ? '自動' : d.id;
  if (d.answer != null) return `<div class="dec"><div class="m"><b>${esc(name)}</b></div><div class="q">${esc(d.question)}</div><div class="done">✔ 已裁決：${esc(d.options[d.answer])}${d.comment ? `（${esc(d.comment)}）` : ''}</div></div>`;
  return `<div class="dec ${d.chain ? 'auto' : ''}"><div class="m"><b>${esc(name)}</b>${d.auto ? `<span class="chip ${d.chain ? 'bad' : 'warn'}">cockpit 自動 · ${esc(d.auto)}</span>` : d.agent ? `<span>${esc(d.agent)}</span>` : ''}${(d.grounds || []).length ? `<span>依據 ${d.grounds.map(id => `<button class="link" data-go="${esc(id)}">${esc(id)}</button>`).join(' ')}</span>` : ''}</div>
    <div class="q">${esc(d.question)}</div>
    <div class="rec">建議 <b>${esc(d.options[d.rec])}</b>：${esc(d.reason)}</div>
    ${stale.length ? `<div class="warnline">⚠ 依據 ${stale.join('、')} 正在待重驗</div>` : ''}
    <div class="opts">${d.options.map((o, i) => `<button class="opt ${i === d.rec ? 'rec' : ''}" data-decide="${esc(d.id)}" data-i="${i}" ${S.until ? 'disabled' : ''}>${esc(o)}</button>`).join('')}<button class="link" data-comment="${esc(d.id)}" style="margin-left:auto">留言並裁決…</button></div>
    ${d.chain ? `<div class="opts"><button class="opt brief" data-viewer="${esc(d.id)}">📄 證據簡報</button>${d.grounds[0] ? `<button class="opt ua" data-tourpick="chain:${esc(d.grounds[0])}">▶ 導覽</button>` : ''}</div>` : ''}</div>`;
}

function renderPanel(){
  if (S.sel) return renderDetail();
  const pend = D.decisions.filter(d => d.answer == null), prem = D.premises.filter(p => p.status === 'open');
  const moms = V.moments.filter(m => !S.until || m.at <= S.until);   // 重播時只列到那一刻為止的
  const seen = Number(store.get(`cockpit:seen:${V.project}`) || 0);
  $('#panel').innerHTML = `<div class="ph">駕駛艙<span style="font-weight:400;font-size:12px;color:var(--muted)">只重新排列既有狀態，每項都帶出處</span><button class="x" data-dock aria-label="收起">✕</button></div>
  <div class="pb">
    <div class="sec"><h3>要你決定 <span class="cnt ${pend.length ? 'hot' : ''}">${pend.length}</span></h3>${D.decisions.length ? [...pend, ...D.decisions.filter(d => d.answer != null)].map(decHTML).join('') : '<p style="font-size:12.5px;color:var(--muted)">沒有</p>'}</div>
    ${moms.length ? `<div class="sec"><h3>簡報紀錄 <span class="cnt">${moms.length}</span></h3>${moms.map(m => `<div class="li" style="flex-wrap:wrap"><span style="color:var(--muted)">#${m.at} · ${esc(hhmm(m.ts))}</span><span style="flex:1;min-width:180px">${esc(m.question)}</span>
      <span class="opts" style="margin-top:2px"><button class="opt" data-viewer="${esc(m.id)}" data-at="${m.at}">看簡報</button><button class="opt" data-playfrom="${Math.max(1, m.at - 3)}">▶ 從這裡播放</button></span></div>`).join('')}
      <p style="font-size:11.5px;color:var(--muted);margin:6px 0 0">證據鏈斷過的每一次。修好之後簡報不會消失，可以回來看當時發生什麼事。</p></div>` : ''}
    <div class="sec"><h3>還沒站穩 <span class="cnt">${prem.length}</span></h3>${prem.map(p => `<div class="li"><span class="risk ${esc(p.risk)}">${esc(p.risk)}</span><span style="flex:1">${esc(p.text)}</span>
      <span class="sub ${p.moved.length ? 'bad' : ''}">${p.moved.length ? `依據的 ${esc(p.moved.join('、'))} 剛被改，風險自動升高` : `被當成地基：${esc(p.used)}`}</span>
      <span class="opts" style="margin-top:2px"><button class="opt" data-premise="${esc(p.id)}" data-v="verified" ${S.until ? 'disabled' : ''}>已驗證</button><button class="opt" data-premise="${esc(p.id)}" data-v="rejected" ${S.until ? 'disabled' : ''}>推翻</button></span></div>`).join('') || '<p style="font-size:12.5px;color:var(--muted)">沒有</p>'}</div>
    <div class="sec"><h3>未回報變更 <span class="cnt ${D.unreported.length ? 'hot' : ''}">${D.unreported.length}</span></h3>${D.unreported.map(u => { const hit = D.claims.filter(c => c.health === 'recheck' && c.files.includes(u.path));
      return `<div class="li"><code>${esc(u.path)}</code><span style="color:var(--muted)">${esc(hhmm(u.ts))}</span>${u.funcs?.length ? `<span class="sub">改到 ${esc(u.funcs.join('、'))} · +${u.add} −${u.del}</span>` : ''}
        ${hit.length ? `<span class="sub bad">⛓ 讓 ${hit.map(c => c.id).join(' ')} 失效 · <button class="link" data-go="file:${esc(u.path)}">在白板上看</button></span>` : ''}</div>`; }).join('') || '<p style="font-size:12.5px;color:var(--muted)">所有變更都有回報</p>'}
      <p style="font-size:11.5px;color:var(--muted);margin:6px 0 0">沒有 agent 回報的變更：git commit 會被擋下，Claude Code 結束回合前會被要求補報。</p></div>
    <div class="sec"><h3>Agent <span class="cnt">回報率 ${D.reportRate}%</span></h3>${D.agents.map(a => `<div class="agent"><span class="ad ${a.task ? '' : 'idle'}"></span><b>${esc(a.name)}</b>
      ${a.task ? `<button class="link" data-go="${esc(a.task)}">${esc(a.task)}</button>` : '<span style="color:var(--muted)">閒置</span>'}<span class="rate">執行 ${a.runs} · 回報 ${a.reports} · 結論 ${a.claims}${a.rejected ? ` · 被拒收 ${a.rejected}` : ''} · ${esc(hhmm(a.last))}</span></div>`).join('') || '<p style="font-size:12.5px;color:var(--muted)">還沒有 agent 連上</p>'}</div>
    <div class="sec"><h3>最近發生 <button class="link" data-seen style="margin-left:auto">標記已讀</button></h3><div class="tl">${V.timeline.slice(0, 30).map(e => `<div class="${e.id > seen && seen ? 'new' : ''} ${e.type === 'file_changed' ? 'bad' : ''}"><time>${esc(hhmm(e.ts))}</time>${esc(e.text)}<em>${esc(e.agent)}</em></div>`).join('')}</div></div>
  </div>`;
}

/* ---------- 右側：卡片詳情 ---------- */
function renderDetail(){
  const n = byId.get(S.sel);
  let html = '';
  if (n.kind === 'analysis') {
    const c = find.claim(n.id), t = V.tours.chains[c.id];
    html = `<div class="kindline">◇ 結論 ${esc(c.id)} · 假設 ${esc(c.hypothesis)} · ${esc(c.agent)}</div><h2>${esc(c.text)}</h2>
      <div class="verdict ${c.health === 'recheck' ? 'bad' : 'ok'}">${c.health === 'recheck' ? `⛓ 待重驗：${esc(c.reasons.join('；'))}` : '✓ 證據鏈完整：執行之後沒有任何一環被改。'}</div>
      <dl class="kv">${c.evidence.map(e => `<dt>${esc(e.run)}</dt><dd><code>${esc(e.path)}</code>${e.key ? ` › <code>${esc(e.key)}</code> = <b>${esc(typeof e.value === 'object' ? JSON.stringify(e.value) : e.value)}</b>` : ''}</dd>`).join('')}</dl>
      <div class="opts"><button class="opt ua" data-tourpick="chain:${esc(c.id)}">▶ 沿證據鏈導覽（UA 格式）</button></div>
      <div style="margin-top:8px">${t.steps.map(s => `<div class="hop ${/被改|過期|覆寫|手改/.test(s.description) ? 'bad' : ''}"><span class="lay">${s.order}</span><button data-go="${esc(s.nodeIds[0])}"><b>${esc(s.title)}</b><small>${esc(s.description)}</small></button></div>`).join('')}</div>
      ${c.doubt.map(f => `<div class="finding">審查 · ${esc(f.severity)} · ${esc(f.path)}${f.line ? `:${f.line}` : ''}：${esc(f.message)}</div>`).join('')}`;
  } else if (n.kind === 'run') {
    const r = find.run(n.id);
    html = `<div class="kindline">▶ 執行 ${esc(r.id)} · cockpit run · ${esc(r.agent)}</div><h2><code>${esc(r.cmd)}</code></h2>
      <dl class="kv"><dt>commit</dt><dd><code>${esc(r.commit || '未 commit')}</code></dd><dt>時間</dt><dd>${esc(new Date(r.ts).toLocaleString('zh-TW'))}（${r.ms} ms，exit ${r.exit}）</dd>
      <dt>寫出</dt><dd>${Object.keys(r.outputs).map(p => `<code>${esc(p)}</code>`).join('<br>') || '沒有'}</dd><dt>依賴來源</dt><dd>${esc(r.deps)}</dd>
      <dt>被引用</dt><dd>${D.claims.filter(c => c.runs.includes(r.id)).map(c => `<button class="link" data-go="${esc(c.id)}">${esc(c.id)}</button>`).join(' ') || '—'}</dd></dl>
      <h3 style="font-size:12px;color:var(--muted);margin:10px 0 4px">用到的程式碼（腳本＋依賴閉包）</h3>
      ${r.files.map(f => `<div class="li"><span>${r.hits.includes(f) ? '✕' : '✓'}</span><button class="link" data-go="file:${esc(f)}"><code>${esc(f)}</code></button>${r.hits.includes(f) ? '<span class="sub bad">執行後被改 → 這次執行過期</span>' : ''}${(r.skipped || []).filter(x => x.path === f).map(x => `<span class="sub">有變更，但改的是 ${esc(x.funcs.join('、'))}，這次執行沒用到 → 不算過期</span>`).join('')}</div>`).join('')}`;
  } else if (n.kind === 'code') {
    const f = find.file(n.id), users = D.runs.filter(r => r.files.includes(f.path));
    html = `<div class="kindline">‹› 檔案 · ${esc(D.depSource)}</div><h2><code>${esc(f.path)}</code></h2>
      <div class="ua-box"><span class="k">${f.fromUA ? 'Understand-Anything 摘要' : '檔案開頭的說明（沒有 UA 知識圖時）'}${f.complexity ? ` · ${esc(f.complexity)}` : ''}</span>${esc(f.summary || '（沒有說明）')}${f.lesson ? `<br><br><b>小知識</b>：${esc(f.lesson)}` : ''}</div>
      ${f.change ? `<div class="verdict ${f.unreported ? 'bad' : 'ok'}">${esc(hhmm(f.change.ts))} 有變更${f.change.funcs?.length ? `：${esc(f.change.funcs.join('、'))}` : ''} · +${f.change.add} −${f.change.del}${f.unreported ? '（沒有 agent 回報）' : `（${esc(f.change.reportedBy)} 已回報）`}</div>` : ''}
      ${f.findings.map(x => `<div class="finding">審查 · ${esc(x.severity)}${x.line ? ` · 第 ${x.line} 行` : ''}：${esc(x.message)}</div>`).join('')}
      <dl class="kv">${f.defs.length ? `<dt>函式／類別</dt><dd>${f.defs.map(d => `<code>${esc(d)}</code>`).join(' ')}</dd>` : ''}
      ${f.callers.length ? `<dt>改動往上影響</dt><dd>${f.callers.map(d => `<code>${esc(d)}</code>`).join(' ')}</dd>` : ''}
      <dt>被哪些執行用到</dt><dd>${users.map(r => `<button class="link" data-go="${esc(r.id)}">${esc(r.id)}</button>`).join(' ') || '—'}</dd>
      <dt>支撐的結論</dt><dd>${D.claims.filter(c => c.files.includes(f.path)).map(c => `<button class="link" data-go="${esc(c.id)}">${esc(c.id)}</button> ${c.health === 'recheck' ? '⛓' : '✓'}`).join('　') || '—'}</dd></dl>`;
  } else if (n.kind === 'agentTask') {
    const t = D.tasks.find(x => x.id === n.id);
    html = `<div class="kindline">✓ 任務 ${esc(t.id)} · ${esc(t.agent)} 自己寫的卡</div><h2>${esc(t.title)}</h2>
      <dl class="kv"><dt>狀態</dt><dd>${esc(t.state)}${t.step ? ` · ${esc(t.step)}` : ''}</dd><dt>位置</dt><dd>${esc(t.where || '—')}</dd><dt>做了什麼</dt><dd>${esc(t.summary)}</dd><dt>為什麼</dt><dd>${esc(t.why)}</dd><dt>下一步</dt><dd>${esc(t.next)}</dd><dt>更新</dt><dd>${esc(hhmm(t.updated))}</dd></dl>`;
  } else if (n.kind === 'stage') {
    const s = D.stages.find(x => x.id === n.id);
    html = `<div class="kindline">◆ 階段 ${esc(s.id)} · 階段是資料，不是提示詞</div><h2>${esc(s.title)}</h2>
      <dl class="kv"><dt>這一關產出</dt><dd>${esc(s.out)}</dd><dt>非叫不可的工具</dt><dd>${s.needs.map(([t, okk]) => `${okk ? '✓' : '✗'} <code>${esc(t)}</code>`).join('<br>') || '—'}</dd><dt>要人看過</dt><dd>${s.human ? '是' : '否'}</dd></dl>`;
  } else {
    const x = D.notes.find(y => y.id === n.id) || {};
    html = `<div class="kindline">▤ ${esc(n.kind)} · ${esc(x.agent)}</div><h2>${esc(x.title)}</h2><p style="white-space:pre-wrap">${esc(x.body || '')}</p>${x.ref ? `<p><code>${esc(x.ref)}</code></p>` : ''}`;
  }
  $('#panel').innerHTML = `<div class="ph"><button class="back" data-back>← 駕駛艙</button><button class="x" data-back aria-label="關閉">✕</button></div>
    <div class="pb detail" style="--kc:var(${KC[n.kind] || '--k-note'})">${html}</div>`;
}

/* ---------- 鏡頭 ---------- */
let view = { x:0, y:0, k:1 };
function apply(){
  $('#world').style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  $('#world').classList.toggle('far', view.k < 0.42);
  $('#zread').textContent = Math.round(view.k * 100) + '%';
  const vp = $('#vp'); vp.style.backgroundSize = `${26 * view.k}px ${26 * view.k}px`; vp.style.backgroundPosition = `${view.x}px ${view.y}px`;
}
function viewFor(b, max = 1){
  const r = $('#vp').getBoundingClientRect(), pad = 50, top = 92, bottom = S.tour ? 190 : 50;
  const k = Math.min(max, (r.width - pad * 2) / b.w, (r.height - top - bottom) / b.h);
  return { k, x:(r.width - b.w * k) / 2 - b.x * k, y:top + (r.height - top - bottom - b.h * k) / 2 - b.y * k };
}
let anim = null;
function flyTo(b, max = 1){
  if (!b) return;
  const to = viewFor(b, max), from = { ...view }, t0 = performance.now(), dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 450;
  cancelAnimationFrame(anim);
  const step = t => { const p = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 3);
    view = { k:from.k + (to.k - from.k) * e, x:from.x + (to.x - from.x) * e, y:from.y + (to.y - from.y) * e }; apply();
    if (p < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
const boundsOf = id => V.board.regions.find(L => L.id === id) || V.board.frames.find(f => f.id === id)
  || (byId.get(id) && (n => ({ x:n.x - 120, y:n.y - 90, w:n.w + 240, h:n.h + 180 }))(byId.get(id)));
const fitAll = () => { view = viewFor(V.board.bounds); apply(); };
function zoomAt(f, cx, cy){ const k = Math.min(2, Math.max(0.06, view.k * f)); view.x = cx - (cx - view.x) * k / view.k; view.y = cy - (cy - view.y) * k / view.k; view.k = k; apply(); }

/* ---------- 互動 ---------- */
const vp = $('#vp');
let drag = null;
vp.addEventListener('pointerdown', e => {
  if (e.target.closest('.toolbar,.zoom,.tourbubble,.viewer')) return;
  const card = e.target.closest('.n'), n = card && byId.get(card.dataset.id);
  drag = { x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:false, card:n, nx:n?.x, ny:n?.y };
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
  drag.moved = true; vp.classList.add('dragging');
  if (drag.card && !S.until) { drag.card.x = drag.nx + dx / view.k; drag.card.y = drag.ny + dy / view.k; render(); }
  else { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
});
vp.addEventListener('pointerup', () => {
  const d = drag; drag = null; vp.classList.remove('dragging');
  if (d?.moved && d.card && !S.until) return post('/api/move', { id:d.card.id, x:Math.round(d.card.x), y:Math.round(d.card.y) });
  if (!d || d.moved) return;
  if (d.card) select(d.card.id); else if (S.sel) { S.sel = null; render(); }
});
vp.addEventListener('wheel', e => {
  if (e.target.closest('.viewer,.tourbubble')) return;
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive:false });
$('#zin').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
$('#zout').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };

async function post(url, body){
  const r = await fetch(url, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) toast(j.error || '送出失敗');
  await load();
  return r.ok;
}
function select(id){
  const n = byId.get(id);
  if (n?.kind === 'html') return openViewer(n.decision);
  S.sel = id; S.tour = null; render();
  if (!S.dock) toggleDock(true);
}
function go(id){ if (byId.has(id)) select(id); else render(); flyTo(boundsOf(id), 1); }
function openViewer(id, until){ $('#viewer').hidden = false; briefHtml(id, until ?? S.until).then(html => { $('#viewerFrame').srcdoc = html; }); }
// 播放重播：一次往前一個事件，播完回到現在。從滑桿目前的位置開始；已經在最後就從頭播
let playT = null;
function play(on = !playT, from){
  clearInterval(playT); playT = null;
  $('#play').textContent = on ? '⏸ 暫停' : '▶ 播放';
  if (!on) return;
  $('#replaybar').hidden = false; $('#replay').setAttribute('aria-pressed', true);
  S.until = from || (!S.until || S.until >= V.lastId ? 1 : S.until);
  load();
  playT = setInterval(() => {
    if (S.until >= V.lastId) { play(false); S.until = null; load(); return; }
    S.until++; load();
  }, Number($('#speed').value));
}
function pickTour(v){ if (v === 'ua') startTour(V.tours.ua); else if (v.startsWith('chain:')) startTour(V.tours.chains[v.slice(6)]); }
function toggleDock(on){ S.dock = on ?? !S.dock; $('#main').classList.toggle('nodock', !S.dock); $('#main').classList.toggle('dockopen', S.dock); setTimeout(fitAll, 30); }

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-lens],[data-persona],[data-go],[data-decide],[data-comment],[data-premise],[data-tour],[data-tourpick],[data-viewer],[data-closeviewer],[data-back],[data-dock],[data-seen],[data-playfrom],#replay,#now,#play,#dockBtn');
  if (!t) return;
  const ds = t.dataset;
  if (ds.lens) { S.lens = ds.lens; render(); ds.lens === 'all' ? flyTo(V.board.bounds, 1) : flyTo(boundsOf(ds.lens), 1); }
  else if (ds.persona) { S.persona = ds.persona; document.querySelectorAll('[data-persona]').forEach(b => b.setAttribute('aria-pressed', b.dataset.persona === S.persona)); render(); toast(`讀者模式：${PERSONA[S.persona]}（Understand-Anything 的 persona）`); }
  else if (ds.go) go(ds.go);
  else if (ds.decide) { if (await post('/api/decide', { id:ds.decide, answer:+ds.i })) toast('已送出，agent 下次呼叫 cockpit_decisions 就會拿到'); }
  else if (ds.comment) {
    const d = D.decisions.find(x => x.id === ds.comment), pick = prompt(`選項：\n${d.options.map((o, i) => `${i + 1}. ${o}`).join('\n')}\n\n輸入選項編號`, String(d.rec + 1));
    const i = Number(pick) - 1;
    if (!(i >= 0 && i < d.options.length)) return;
    const comment = prompt('給 agent 的留言') || '';
    if (await post('/api/decide', { id:d.id, answer:i, comment })) toast('已送出裁決與留言');
  }
  else if (ds.premise) await post('/api/premise', { id:ds.premise, verdict:ds.v });
  else if (ds.tourpick) pickTour(ds.tourpick);
  else if (ds.tour) {
    if (ds.tour === 'end') S.tour = null;
    else { S.tour.i += +ds.tour; if (S.tour.i >= S.tour.steps.length) S.tour = null; }
    render(); if (S.tour) flyTo(boundsOf(S.tour.steps[S.tour.i].nodeIds[0]), 1);
  }
  else if (ds.viewer) openViewer(ds.viewer, ds.at ? +ds.at : undefined);
  else if ('closeviewer' in ds) $('#viewer').hidden = true;
  else if ('back' in ds) { S.sel = null; render(); }
  else if ('seen' in ds) { store.set(`cockpit:seen:${V.project}`, V.lastId); render(); }
  else if ('dock' in ds || t.id === 'dockBtn') toggleDock();
  else if (t.id === 'replay') { const on = $('#replaybar').hidden; $('#replaybar').hidden = !on; t.setAttribute('aria-pressed', on); if (!on) { play(false); S.until = null; load(); } }
  else if (t.id === 'now') { play(false); S.until = null; $('#replaybar').hidden = true; $('#replay').setAttribute('aria-pressed', false); load(); }
  else if (t.id === 'play') play();
  else if (ds.playfrom) play(true, +ds.playfrom);
});
let ut = null;
$('#until').addEventListener('input', e => { play(false); clearTimeout(ut); ut = setTimeout(() => { const v = +e.target.value; S.until = v >= V.lastId ? null : v; load(); }, 120); });
$('#speed').addEventListener('change', () => { if (playT) play(true, S.until); });
$('#tourPick').addEventListener('change', e => { const v = e.target.value; e.target.value = ''; if (v) pickTour(v); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#viewer').hidden) $('#viewer').hidden = true; else if (S.tour) { S.tour = null; render(); } else if (S.sel) { S.sel = null; render(); }
});

let matches = [], mi = -1;
function applySearch(){
  const q = $('#search').value.trim().toLowerCase();
  matches = q ? V.board.nodes.filter(n => (document.querySelector(`.n[data-id="${CSS.escape(n.id)}"]`)?.textContent || '').toLowerCase().includes(q)).map(n => n.id) : [];
  document.querySelectorAll('.n').forEach(el => el.classList.toggle('match', !!q && matches.includes(el.dataset.id)));
  $('#hud').textContent = q ? `找到 ${matches.length} 張（Enter 跳下一張）` : '拖曳平移 · 拖卡片移動 · ⌘＋滾輪縮放';
}
$('#search').addEventListener('input', () => { mi = -1; applySearch(); });
$('#search').addEventListener('keydown', e => { if (e.key === 'Enter' && matches.length) { mi = (mi + 1) % matches.length; go(matches[mi]); } });
function toast(m){ const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2800); }

const es = new EventSource('/events');
es.onopen = () => $('#live').classList.add('on');
es.onerror = () => $('#live').classList.remove('on');
es.addEventListener('change', () => { if (!S.until) load(); });
load().then(() => requestAnimationFrame(fitAll));
addEventListener('resize', () => V && fitAll());
</script>

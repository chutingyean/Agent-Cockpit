name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # 測試會在暫存資料夾複製示範研究專案、真的跑 python3 實驗
      - run: python3 --version && npm test
